[package]
name = "mdp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Store and switch macOS multi-display layouts (positions + primary display) from the CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/define9/mdp"
homepage = "https://github.com/define9/mdp"
keywords = ["macos", "display", "monitor", "cli", "tui", "multitasking"]
categories = ["command-line-utilities"]
exclude = [".mise.toml", "/.github"]

[[bin]]
name = "mdp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
toml = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
